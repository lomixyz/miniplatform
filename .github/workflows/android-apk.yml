name: Build Android APK

# Builds the MiniPlatform Android app (a Capacitor WebView shell pointed at
# the live server — see capacitor.config.ts) into an installable .apk on
# every push, and on manual trigger. Runs entirely on GitHub's own servers,
# which can reach dl.google.com for the Android SDK (the Claude cloud
# sandbox used to develop this app cannot, hence doing the actual build
# here instead).
#
# Produces a DEBUG-signed APK: installs on any Android phone with "install
# from unknown sources" allowed, but is NOT suitable for Play Store
# submission (that needs a release keystore — see the commented-out
# release job below once you have one).

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miniplatform-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

