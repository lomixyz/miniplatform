name: Build iOS App

# Validates (and, once you add signing secrets, archives) the MiniPlatform
# iOS app — a Capacitor WebView shell pointed at the live server, same as
# the Android app (see capacitor.config.ts). Must run on a macOS runner:
# Xcode only exists on macOS, which is why this can't be built in a Linux
# sandbox. Dependency resolution uses Swift Package Manager (ios/App/CapApp-SPM),
# so no CocoaPods step is needed.
#
# By default this job only *builds* for the iOS Simulator — that proves the
# project compiles on every push, but a simulator build cannot be installed
# on a real iPhone or submitted anywhere. To get an actual .ipa you can
# install on a device or upload to TestFlight/App Store, you need an Apple
# Developer Program account ($99/year) and must add signing secrets — see
# the commented-out archive job below.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch: {}

jobs:
  build-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build for iOS Simulator (unsigned, validates the project compiles)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload simulator .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: miniplatform-ios-simulator-app
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 30

