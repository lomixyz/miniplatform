# Nginx reverse proxy for MiniPlatform, with WebSocket (Socket.io) upgrade
# support — this is the part a plain "static site" Nginx config misses.
#
# Install at /etc/nginx/sites-available/miniplatform, then symlink into
# sites-enabled (see deploy guide, step 5). Replace yourdomain.com with your
# real domain, or leave server_name as your server's IP if you don't have one
# yet (certbot requires a real domain for HTTPS, though).

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Required for Socket.io / WebSocket upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep long-lived WebSocket connections open
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

# After running `sudo certbot --nginx -d yourdomain.com`, certbot will
# automatically add a matching `listen 443 ssl;` server block below this one
# and redirect port 80 to it — you don't need to write that part by hand.
